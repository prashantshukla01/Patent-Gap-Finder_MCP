[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Run alembic migrations then start server
# Railway injects $PORT — server reads it via MCP_PORT env var
startCommand = "alembic upgrade head && python -m patent_gap_finder.server"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 3

[deploy.envVars]
MCP_TRANSPORT = "streamable-http"
PYTHONPATH = "/app/src"
PYTHONUNBUFFERED = "1"
