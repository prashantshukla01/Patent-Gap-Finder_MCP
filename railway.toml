[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m patent_gap_finder.server"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 3

[deploy.envVars]
MCP_TRANSPORT = "streamable-http"
MCP_PORT = { fromService = "", envVariable = "PORT" }
PYTHONPATH = "/app/src"
PYTHONUNBUFFERED = "1"
