[project]
name = "patent-gap-finder"
version = "1.0.0"
description = "MCP server that analyzes research papers to discover patentable white-space opportunities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Patent Gap Finder Team" }]

dependencies = [
    # Phase 1
    "fastmcp>=2.0",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    # Phase 2
    "google-generativeai>=0.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "google-api-core>=2.19",
    "greenlet>=3.0",
    # Phase 3
    "redis>=5.0",
    "celery>=5.3",
    "psycopg2-binary>=2.9",
    # Phase 4
    "sentence-transformers>=3.0",
    "torch>=2.0",
    "hdbscan>=0.8.33",
    "qdrant-client>=1.9",
    "numpy>=1.26",
    "scipy>=1.13",
    # Phase 5
    "reportlab>=4.0",
    "starlette>=0.37",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "aiosqlite>=0.20",
]

[project.scripts]
patent-gap-finder = "patent_gap_finder.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patent_gap_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
